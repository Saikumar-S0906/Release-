name: PixiJoy QA

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "local suite name (unit only in CI by default)"
        default: "unit"

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew detekt --console=plain
        continue-on-error: true

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            app/build/reports/**
            **/build/reports/detekt/**

