appId: com.pixijoy.ai
---
# Curves grade path — editor rail
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- extendedWaitUntil:
    visible:
      id: "create_hub_editor"
    timeout: 20000
- tapOn:
    id: "create_hub_editor"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 25000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_color"
- tapOn:
    id: "session_curves"
- extendedWaitUntil:
    visible:
      id: "session_curves_hint"
    timeout: 15000
- assertVisible:
    id: "curve_0"
- assertVisible:
    id: "curve_1"
- assertVisible:
    id: "curve_2"
- assertVisible:
    id: "curve_3"
- scrollUntilVisible:
    element:
      id: "curve_4"
    direction: RIGHT
    timeout: 15000
    visibilityPercentage: 40
- assertVisible:
    id: "curve_4"
- assertVisible:
    id: "session_apply_curves"
- tapOn:
    id: "session_apply_curves"
- extendedWaitUntil:
    visible:
      id: "session_export"
    timeout: 30000
- assertVisible:
    id: "session_export"
