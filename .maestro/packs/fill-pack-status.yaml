appId: com.pixijoy.studio
---
# E1 Fill pack CTA. Missing shows Download (Release- pin) and Install from file.
# The empty plate line is studio_packs_empty, not studio_pack_missing (that string
# is not composed until a different state). Nearby-pixel Apply stays on.
# Neural Apply is present and stays off until engineReady.
# This flow does not download the ~75 MB file and does not claim engineReady.
# Glass chrome is 280dp — assert the status line before scrolling it off screen.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_fill"
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_fill_pack_status"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_fill_pack_status"
    timeout: 15000
- assertVisible: "Download an on-device model pack. Edits never leave this phone."
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_apply_fill_neural"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_fill_pack_download"
    timeout: 15000
- assertVisible:
    id: "session_fill_pack_download"
- assertVisible:
    id: "session_fill_pack_download_from_file"
- assertVisible:
    id: "session_apply_fill"
- assertVisible:
    id: "session_apply_fill_neural"
- assertVisible: "Apply nearby-pixel fill"
