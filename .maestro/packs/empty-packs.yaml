appId: com.pixijoy.ai
---
# G7 pack plate. empty_packs is the Missing/installing/failed surface in PackChrome.
# clearState leaves the inpaint pack Missing. The plate shows Download and
# Install from file. Do not tap Download (the file is ~75 MB) and do not pick a file.
# Ready hides empty_packs. This does not claim a neural engine.
# Not re-run on a device after the Download CTA was added.
# Glass chrome is 280dp — tap studio_scroll_more until the Install CTA is in view.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_fill"
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_fill_pack_download_from_file"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_fill_pack_download_from_file"
    timeout: 15000
- assertVisible:
    id: "empty_packs"
- assertVisible:
    id: "session_fill_pack_status"
- assertVisible: "Unavailable until this on-device pack is downloaded. Your photo stays on the phone; only the model file is fetched."
- assertVisible:
    id: "session_fill_pack_download"
- assertVisible:
    id: "session_fill_pack_download_from_file"
