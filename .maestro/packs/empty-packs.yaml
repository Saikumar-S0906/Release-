appId: com.pixijoy.studio
---
# G7 pack plate. empty_packs is the Missing/installing/failed surface in PackChrome.
# clearState leaves the inpaint pack Missing. The plate line is studio_packs_empty.
# It also shows Download and Install from file. Do not tap Download (~75 MB).
# Ready hides empty_packs. This does not claim a neural engine.
# Glass chrome is 280dp — assert the status line before scrolling to the CTAs.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_fill"
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_fill_pack_status"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_fill_pack_status"
    timeout: 15000
- assertVisible:
    id: "empty_packs"
- assertVisible:
    id: "session_fill_pack_status"
- assertVisible: "Download an on-device model pack. Edits never leave this phone."
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_fill_pack_download_from_file"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_fill_pack_download_from_file"
    timeout: 15000
- assertVisible:
    id: "session_fill_pack_download"
- assertVisible:
    id: "session_fill_pack_download_from_file"
