appId: com.pixijoy.ai
---
# G7 pack plate. empty_packs is the Missing/installing/failed surface in PackChrome.
# clearState leaves the inpaint pack Missing. Inpaint has no hosted weight, so the
# plate shows Install from file, not Download. Do not pick a file. Ready hides
# empty_packs. This does not claim a neural engine.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_fill"
- extendedWaitUntil:
    visible:
      id: "empty_packs"
    timeout: 10000
- assertVisible:
    id: "session_fill_pack_status"
- assertVisible: "This pack is not hosted for download in this build. Use Install from file, or copy the .tflite into the incoming folder. Play Store modules are not shipped yet."
- assertVisible:
    id: "session_fill_pack_download_from_file"
- assertNotVisible:
    id: "session_fill_pack_download"
- assertVisible:
    id: "session_apply_fill"
