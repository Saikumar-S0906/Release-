appId: com.pixijoy.ai
---
# G7 pack download plate. empty_packs is the Missing/installing/failed surface in PackChrome.
# clearState leaves the inpaint pack Missing, so Fill shows the plate and Download.
# Do not tap Download. Ready hides empty_packs. This does not claim a neural engine.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_fill"
- extendedWaitUntil:
    visible:
      id: "empty_packs"
    timeout: 10000
- assertVisible:
    id: "session_fill_pack_status"
- assertVisible: "Download to unlock"
- assertVisible:
    id: "session_fill_pack_download"
- assertVisible:
    id: "session_apply_fill"
