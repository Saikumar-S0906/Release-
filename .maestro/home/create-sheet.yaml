appId: com.pixijoy.studio
---
# Create → source sheet. Sheet sets testTagsAsResourceId; assert ids + labels.
- runFlow: ../launch-to-home.yaml
- assertVisible:
    id: "home_create"
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible:
      id: "create_source_sheet"
    timeout: 20000
- assertVisible:
    id: "create_source_sheet_body"
- assertVisible:
    id: "source_photo"
- assertVisible:
    id: "source_video"
- assertVisible:
    id: "source_camera"
- assertVisible:
    id: "source_sample"
- assertVisible: "Photo"
- assertVisible: "Movie"
- assertVisible: "Camera"
- assertVisible: "Try a sample"
