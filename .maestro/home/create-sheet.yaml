appId: com.pixijoy.ai
---
# Create → source sheet. The sheet sets testTagsAsResourceId, but this flow stays
# on visible text until a device hierarchy dump shows the resource-ids.
# Do not treat the commented id asserts as green.
- runFlow: ../launch-to-home.yaml
- assertVisible:
    id: "home_create"
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- assertVisible: "Photo"
- assertVisible: "Video"
- assertVisible: "Camera"
- assertVisible: "Try a sample"
# Soft when Dialog tags merge:
# - assertVisible:
#     id: "create_source_sheet"
# - assertVisible:
#     id: "source_sample"
