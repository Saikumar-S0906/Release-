appId: com.pixijoy.studio
---
# Talking-photo hub opens a movie session on the sample. Mic recording is not started.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home_create"
    timeout: 90000
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_talking"
    timeout: 20000
- tapOn:
    id: "create_hub_talking"
- extendedWaitUntil:
    visible:
      id: "studio_use_sample"
    timeout: 20000
- tapOn:
    id: "studio_use_sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- assertVisible:
    id: "movie_play"
