appId: com.pixijoy.studio
---
# Deliver presets, a review note, local handoff, and tool search.
# Share / View in another app is not tapped.
- runFlow: ../open-movie-sample.yaml
- tapOn:
    id: "movie_tool_search"
- inputText: "grade"
- extendedWaitUntil:
    visible:
      id: "movie_tool_jump_color"
    timeout: 15000
- tapOn:
    id: "movie_tool_jump_color"
- extendedWaitUntil:
    visible:
      id: "movie_d5_hint"
    timeout: 20000
- tapOn:
    id: "studio_group_deliver"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_deliver_social"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- tapOn:
    id: "movie_deliver_social"
- assertVisible:
    id: "movie_deliver_preset_summary"
- tapOn:
    id: "movie_deliver_review"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_deliver_note_add"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- tapOn:
    id: "movie_deliver_note_field"
- inputText: "Look"
- tapOn:
    id: "movie_deliver_note_add"
# Write handoff sits on the last row. One more page lifts it off the More label.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_deliver_write_handoff"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- runFlow:
    when:
      visible:
        id: "studio_scroll_more"
    commands:
      - tapOn:
          id: "studio_scroll_more"
- tapOn:
    id: "movie_deliver_write_handoff"
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_deliver_handoff_path"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "movie_deliver_handoff_path"
    timeout: 20000
# The status line is the full sentence, not the prefix alone.
- assertVisible:
    id: "session_status"
- assertVisible:
    id: "movie_session"
