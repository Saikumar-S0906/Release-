appId: com.pixijoy.ai
---
# R3.1 Best-for + Recommended on Studio hub
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "studio_recommended_label"
    timeout: 15000
- assertVisible:
    id: "studio_recommended_row"
- assertVisible:
    id: "recommended_create_hub_editor"
- assertVisible:
    id: "recommended_create_hub_remove_bg"
- assertVisible: "Best for: everyday edits"
- assertVisible: "Best for: remove the background"
- assertVisible:
    id: "create_hub_restore"
- assertVisible: "Best for: remove unwanted objects"
