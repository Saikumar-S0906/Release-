appId: com.pixijoy.ai
---
# Press-hold session_compare (no sticky). Soft: canCompare only with live delta.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- assertVisible:
    id: "session_compare"
- assertVisible:
    id: "session_save_status"
- longPressOn:
    id: "session_compare"
- assertVisible:
    id: "session_export"
