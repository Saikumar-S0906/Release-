appId: com.pixijoy.ai
---
# Pointer press-hold is momentary; TalkBack exposes a toggle action. Compare is disabled on a
# fresh sample, enables for a live Look, and remains meaningful after that Look is baked.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- assertVisible:
    id: "session_compare"
- assertVisible: "Apply an edit to compare."
- assertVisible:
    id: "session_viewport"
- assertVisible:
    id: "session_save_status"
- tapOn:
    id: "studio_group_color"
- tapOn:
    id: "session_looks"
- extendedWaitUntil:
    visible:
      id: "look_warm"
    timeout: 15000
- tapOn:
    id: "look_warm"
- assertVisible: "After · hold for Before"
- longPressOn:
    id: "session_compare"
- longPressOn:
    id: "session_viewport"
- doubleTapOn:
    id: "session_viewport"
- tapOn:
    id: "session_apply_look"
- extendedWaitUntil:
    visible: "After · hold for Before"
    timeout: 30000
- longPressOn:
    id: "session_compare"
- assertVisible:
    id: "session_export"
