appId: com.pixijoy.studio
---
# A11y-tree smoke (G4 labels). System TalkBack-on is still optional manual —
# see ../YELLOW-talkback-studio.md. This flow is the Wave 2 automated gate.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- assertVisible: "Crop"
- assertVisible:
    id: "session_undo"
- assertVisible:
    id: "session_crop_overlay"
- assertVisible: "Crop edge, left"
- assertVisible: "Crop edge, right"
- assertVisible: "Crop edge, top"
- assertVisible: "Crop edge, bottom"
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet"
    timeout: 20000
- assertVisible:
    id: "export_sheet_confirm"
