appId: com.pixijoy.studio
---
# Phone landscape (wide + short): side tools beside canvas (not bottom glass).
# Drive orientation from the host before this flow (Maestro 2.10 has no setOrientation):
#   adb shell settings put system accelerometer_rotation 0
#   adb shell settings put system user_rotation 1
# Restore after:
#   adb shell settings put system user_rotation 0
#   adb shell settings put system accelerometer_rotation 1
# Note: wm size alone does not flip Configuration on API 35 Pixel AVDs — use user_rotation.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible:
      id: "create_source_sheet"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "source_sample"
    timeout: 10000
- tapOn:
    id: "source_sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 90000
- assertVisible:
    id: "studio_session_side_tools"
- assertNotVisible:
    id: "studio_chrome_bar"
- assertNotVisible:
    id: "studio_two_pane"
- assertNotVisible:
    id: "nav_home"
- tapOn:
    id: "studio_group_light"
- tapOn:
    id: "session_light_exposure"
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_slider_value"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "session_slider_value"
    timeout: 15000
- assertVisible:
    id: "session_export"
- assertVisible:
    id: "photo_session"
