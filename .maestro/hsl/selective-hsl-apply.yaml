appId: com.pixijoy.studio
---
# Selective HSL under glass scrim — PhotoOp.SelectiveHsl / graph A
# Band row is StudioHScrollRow — tap studio_hscroll_more for Magentas.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_color"
- tapOn:
    id: "session_selective_hsl"
- extendedWaitUntil:
    visible:
      id: "session_tool_scrim"
    timeout: 15000
- assertVisible:
    id: "photo_session"
- assertVisible:
    id: "hsl_range_reds"
- assertVisible:
    id: "hsl_range_greens"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_hscroll_more"
            notVisible:
              id: "hsl_range_magentas"
          commands:
            - tapOn:
                id: "studio_hscroll_more"
- extendedWaitUntil:
    visible:
      id: "hsl_range_magentas"
    timeout: 15000
- assertVisible:
    id: "hsl_range_magentas"
- tapOn:
    id: "hsl_range_greens"
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "session_apply_selective_hsl"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- assertVisible:
    id: "session_apply_selective_hsl"
- tapOn:
    id: "session_apply_selective_hsl"
- extendedWaitUntil:
    visible:
      id: "session_export"
    timeout: 30000
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet"
    timeout: 20000
- assertVisible:
    id: "export_sheet_confirm"
