appId: com.pixijoy.ai
---
# After chrome — movie groups and pinned timeline.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 25000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- assertVisible:
    id: "movie_timeline"
- assertVisible:
    id: "movie_timeline_strip"
- assertVisible:
    id: "timeline_clip"
- tapOn:
    id: "movie_frame_next"
- tapOn:
    id: "movie_play"
- tapOn:
    id: "studio_group_edit"
- takeScreenshot: movie_edit
# The bundled sample is a real MP4, so the pinned video timeline remains visible.
- assertVisible:
    id: "movie_d2_hint"
- tapOn:
    id: "studio_group_audio"
- takeScreenshot: movie_audio
- tapOn:
    id: "studio_group_text"
- takeScreenshot: movie_text
- tapOn:
    id: "studio_group_color"
- takeScreenshot: movie_color
- tapOn:
    id: "studio_group_effects"
- takeScreenshot: movie_effects
- tapOn:
    id: "studio_group_layout"
- takeScreenshot: movie_layout
- assertVisible:
    id: "movie_layout_export_hint"
