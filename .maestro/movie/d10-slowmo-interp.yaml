appId: com.pixijoy.studio
---
# D10 — slow-mo / frame-interp contract in movie session.
# Glass chrome is 280dp — prefer studio_scroll_more when scrollUntilVisible stalls.
# Avoid waitForAnimationToEnd (ExoPlayer keeps the tree animating).
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_effects"
- tapOn:
    id: "movie_effect_slow"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_slowmo_presets"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "movie_slowmo_presets"
    timeout: 20000
- assertVisible:
    id: "movie_d10_hint"
- assertVisible:
    id: "movie_slowmo_off"
- assertVisible:
    id: "movie_slowmo_half"
- assertVisible:
    id: "movie_slowmo_quarter"
- assertVisible:
    id: "movie_slowmo_eighth"
- tapOn:
    id: "movie_slowmo_quarter"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_slowmo_engines"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "movie_slowmo_engines"
    timeout: 20000
- assertVisible:
    id: "movie_slowmo_heuristic"
- assertVisible:
    id: "movie_slowmo_ml"
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_slowmo_resolved"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "movie_slowmo_resolved"
    timeout: 15000
- assertVisible:
    id: "movie_slowmo_resolved"
- tapOn:
    id: "movie_slowmo_ml"
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_slowmo_pack_status"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- assertVisible:
    id: "movie_slowmo_pack_status"
- assertVisible:
    id: "movie_session"
