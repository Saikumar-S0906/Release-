appId: com.pixijoy.ai
---
# D10 — slow-mo / frame-interp contract in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "movie_d10_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- scrollUntilVisible:
    element:
      id: "movie_slowmo_presets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_slowmo_off"
- assertVisible:
    id: "movie_slowmo_half"
- assertVisible:
    id: "movie_slowmo_quarter"
- assertVisible:
    id: "movie_slowmo_eighth"
- tapOn:
    id: "movie_slowmo_quarter"
- scrollUntilVisible:
    element:
      id: "movie_slowmo_engines"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_slowmo_heuristic"
- assertVisible:
    id: "movie_slowmo_ml"
- scrollUntilVisible:
    element:
      id: "movie_slowmo_resolved"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_slowmo_resolved"
- tapOn:
    id: "movie_slowmo_ml"
- assertVisible:
    id: "movie_session"
