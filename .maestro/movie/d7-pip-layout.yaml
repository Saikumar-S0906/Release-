appId: com.pixijoy.ai
---
# D7 — PiP / multicam layout presets in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "movie_d7_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- scrollUntilVisible:
    element:
      id: "movie_layout_presets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_layout_single"
- assertVisible:
    id: "movie_layout_pip"
- assertVisible:
    id: "movie_layout_split"
- assertVisible:
    id: "movie_layout_grid"
- tapOn:
    id: "movie_layout_pip"
- assertVisible:
    id: "movie_layout_presets"
- tapOn:
    id: "movie_layout_split"
- assertVisible:
    id: "movie_session"
