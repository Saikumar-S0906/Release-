appId: com.pixijoy.studio
---
# D8 — stabilize + reframe presets in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_effects"
- tapOn:
    id: "movie_effect_frame"
- scrollUntilVisible:
    element:
      id: "movie_d8_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- scrollUntilVisible:
    element:
      id: "movie_stabilize_presets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_stabilize_off"
- assertVisible:
    id: "movie_stabilize_light"
- assertVisible:
    id: "movie_stabilize_medium"
- assertVisible:
    id: "movie_stabilize_strong"
- tapOn:
    id: "movie_stabilize_medium"
- scrollUntilVisible:
    element:
      id: "movie_reframe_presets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_reframe_original"
- assertVisible:
    id: "movie_reframe_close"
- assertVisible:
    id: "movie_reframe_vertical"
- tapOn:
    id: "movie_reframe_close"
- assertVisible:
    id: "movie_session"
