appId: com.pixijoy.ai
---
# D1 multi-track — open movie session + track chips
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_layout"
- extendedWaitUntil:
    visible:
      id: "movie_tracks"
    timeout: 15000
- assertVisible:
    id: "movie_track_V1"
- assertVisible:
    id: "movie_track_A1"
- tapOn:
    id: "movie_track_V1"
- assertVisible:
    id: "movie_session"
