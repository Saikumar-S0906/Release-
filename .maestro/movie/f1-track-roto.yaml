appId: com.pixijoy.ai
---
# F1 tracking / roto-lite contract in movie session.
# Track sits under the effects h-scroll fade — tap studio_hscroll_more until the
# chip speaks "Track, selected", then reveal the locked plate with vertical More.
# Hint can scroll off after More; assert it before the locked-row scroll.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_effects"
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_hscroll_more"
            notVisible: "Track, selected"
          commands:
            - tapOn:
                id: "studio_hscroll_more"
            - tapOn:
                id: "movie_effect_track"
- extendedWaitUntil:
    visible: "Track, selected"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "movie_f1_hint"
    timeout: 10000
- assertVisible:
    id: "movie_f1_hint"
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_track_locked"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- assertVisible:
    id: "movie_track_pack_status"
- assertVisible:
    id: "movie_track_locked"
