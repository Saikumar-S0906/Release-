appId: com.pixijoy.ai
---
# F1 tracking — bundled track.tflite in APK. No Download CTA. Toggle unlocks
# when LiteRT binds (movie_track_locked clears); pack status says included.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_effects"
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_hscroll_more"
            notVisible: "Track, selected"
          commands:
            - tapOn:
                id: "studio_hscroll_more"
            - tapOn:
                id: "movie_effect_track"
- extendedWaitUntil:
    visible: "Track, selected"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "movie_f1_hint"
    timeout: 10000
- assertVisible:
    id: "movie_f1_hint"
- assertVisible:
    id: "movie_track_pack_status"
- assertVisible:
    id: "movie_track_toggle"
- assertNotVisible:
    id: "movie_track_pack_download"
