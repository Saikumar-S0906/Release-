appId: com.pixijoy.ai
---
# D3 — keyframed motion preset in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_effects"
- scrollUntilVisible:
    element:
      id: "movie_d3_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_motion_none"
- assertVisible:
    id: "movie_motion_zoom_in"
- tapOn:
    id: "movie_motion_zoom_in"
- assertVisible:
    id: "movie_motion_presets"
- assertVisible:
    id: "movie_motion_zoom_in"
- assertVisible:
    id: "movie_session"
