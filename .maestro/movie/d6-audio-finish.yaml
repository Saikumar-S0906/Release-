appId: com.pixijoy.ai
---
# D6 — audio finish duck presets in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_audio"
- scrollUntilVisible:
    element:
      id: "movie_d6_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- scrollUntilVisible:
    element:
      id: "movie_duck_presets"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    speed: 40
- assertVisible:
    id: "movie_duck_soft"
- assertVisible:
    id: "movie_duck_medium"
- assertVisible:
    id: "movie_duck_hard"
- assertVisible:
    id: "movie_duck_presets"
- scrollUntilVisible:
    element:
      id: "movie_add_voice"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_add_voice"
- assertVisible:
    id: "movie_session"
