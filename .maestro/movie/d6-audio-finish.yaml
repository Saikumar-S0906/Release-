appId: com.pixijoy.studio
---
# D6 — audio finish duck presets in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_audio"
# Duck presets sit under the sound panel. The glass scroller is the More control, not a swipe.
- repeat:
    times: 24
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_d6_hint"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "movie_d6_hint"
    timeout: 15000
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_duck_presets"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- assertVisible:
    id: "movie_duck_soft"
- assertVisible:
    id: "movie_duck_medium"
- assertVisible:
    id: "movie_duck_hard"
- assertVisible:
    id: "movie_duck_presets"
- repeat:
    times: 16
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "movie_add_voice"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- assertVisible:
    id: "movie_add_voice"
- assertVisible:
    id: "movie_session"
