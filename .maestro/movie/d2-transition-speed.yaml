appId: com.pixijoy.studio
---
# D2 — focused Roll, Transition, and Speed controls
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- tapOn:
    id: "studio_group_edit"
- scrollUntilVisible:
    element:
      id: "movie_d2_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_transition_none"
- assertVisible:
    id: "movie_transition_soft"
- tapOn:
    id: "movie_d2_roll"
- assertVisible:
    id: "movie_roll_left"
- assertVisible:
    id: "movie_roll_right"
- tapOn:
    id: "movie_d2_transition"
- tapOn:
    id: "movie_transition_soft"
- extendedWaitUntil:
    visible:
      id: "movie_transition_ms"
    timeout: 10000
- tapOn:
    id: "movie_d2_speed"
- assertVisible:
    id: "movie_speed_start"
- assertVisible:
    id: "movie_speed_end"
- assertVisible:
    id: "movie_session"
