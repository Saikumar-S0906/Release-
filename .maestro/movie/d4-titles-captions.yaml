appId: com.pixijoy.ai
---
# D4 — title / caption layers in movie session
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_open_studio"
- extendedWaitUntil:
    visible:
      id: "create_hub_segment_movie"
    timeout: 20000
- tapOn:
    id: "create_hub_segment_movie"
- extendedWaitUntil:
    visible:
      id: "create_hub_move"
    timeout: 20000
- tapOn:
    id: "create_hub_move"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "movie_d4_hint"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_title_add"
- assertVisible:
    id: "movie_caption_add"
- tapOn:
    id: "movie_title_add"
- scrollUntilVisible:
    element:
      id: "movie_title_t0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
    speed: 40
- assertVisible:
    id: "movie_titles_row"
- assertVisible:
    id: "movie_title_t0"
- assertVisible:
    id: "movie_session"
