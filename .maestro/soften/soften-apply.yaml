appId: com.pixijoy.studio
---
# C8 Soften — rail + Apply
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
- tapOn:
    id: "session_soften"
- extendedWaitUntil:
    visible:
      id: "session_soften_hint"
    timeout: 10000
- assertVisible:
    id: "soften_amount"
- tapOn:
    id: "session_apply_soften"
- assertVisible:
    id: "session_export"
