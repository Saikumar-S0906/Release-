appId: com.pixijoy.ai
---
# C8 Soften — rail + Apply
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "session_sky"
    direction: RIGHT
    timeout: 40000
    visibilityPercentage: 30
    speed: 40
- swipe:
    start: 85%, 87%
    end: 20%, 87%
    duration: 500
- swipe:
    start: 85%, 87%
    end: 20%, 87%
    duration: 500
- extendedWaitUntil:
    visible:
      id: "session_soften"
    timeout: 10000
- tapOn:
    id: "session_soften"
- extendedWaitUntil:
    visible:
      id: "session_soften_hint"
    timeout: 10000
- assertVisible:
    id: "soften_amount"
- tapOn:
    id: "session_apply_soften"
- assertVisible:
    id: "session_export"
