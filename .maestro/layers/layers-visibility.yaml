appId: com.pixijoy.ai
---
# Seeded Layers hub — panel present without blur seed
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- extendedWaitUntil:
    visible:
      id: "create_hub_layers"
    timeout: 20000
- tapOn:
    id: "create_hub_layers"
- extendedWaitUntil:
    visible: "Use sample"
    timeout: 25000
- tapOn: "Use sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "layers_panel"
    timeout: 20000
- assertVisible:
    id: "layer_visibility"
- tapOn:
    id: "layer_visibility"
- assertVisible:
    id: "layer_fade"
- scrollUntilVisible:
    element:
      id: "blend_normal"
    direction: LEFT
    timeout: 20000
    visibilityPercentage: 40
- assertVisible:
    id: "blend_normal"
- assertVisible:
    id: "blend_multiply"
