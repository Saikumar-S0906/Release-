appId: com.pixijoy.ai
---
# Seeded Layers hub — panel present without blur seed.
# Visibility sits under studio_scroll_more in the 280dp glass.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- extendedWaitUntil:
    visible:
      id: "create_hub_layers"
    timeout: 20000
- tapOn:
    id: "create_hub_layers"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 25000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "layers_panel"
    timeout: 20000
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_scroll_more"
            notVisible:
              id: "layer_visibility"
          commands:
            - tapOn:
                id: "studio_scroll_more"
- extendedWaitUntil:
    visible:
      id: "layer_visibility"
    timeout: 15000
- assertVisible:
    id: "layer_visibility"
- tapOn:
    id: "layer_visibility"
- assertVisible:
    id: "layer_fade"
- scrollUntilVisible:
    element:
      id: "blend_normal"
    direction: LEFT
    timeout: 20000
    visibilityPercentage: 40
- assertVisible:
    id: "blend_normal"
- assertVisible:
    id: "blend_multiply"
