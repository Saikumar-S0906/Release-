appId: com.pixijoy.ai
---
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_layers"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 25000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "layers_panel"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "blend_normal"
    direction: LEFT
    timeout: 20000
    visibilityPercentage: 40
- assertVisible:
    id: "blend_normal"
- assertVisible:
    id: "blend_multiply"
- assertVisible:
    id: "blend_screen"
- assertVisible:
    id: "blend_overlay"
- tapOn:
    id: "blend_multiply"
