appId: com.pixijoy.studio
---
# C4 Sky / background replace — rail + Apply
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "studio_group_retouch"
# Sky is the last retouch chip. The horizontal More fade covers its center until the row moves.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible:
              id: "studio_hscroll_more"
            notVisible:
              id: "session_sky"
          commands:
            - tapOn:
                id: "studio_hscroll_more"
- swipe:
    direction: LEFT
    duration: 400
    from:
      id: "session_denoise"
- tapOn:
    id: "session_sky"
- extendedWaitUntil:
    visible:
      id: "session_sky_hint"
    timeout: 10000
- assertVisible:
    id: "sky_target_sky"
- assertVisible:
    id: "sky_preset_blue"
- tapOn:
    id: "sky_preset_deep"
- tapOn:
    id: "session_apply_sky"
- assertVisible:
    id: "session_export"
- assertVisible:
    id: "session_tool_scrim"
