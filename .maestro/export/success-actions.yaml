appId: com.pixijoy.ai
---
# Export sheet → confirm → success actions (View / Share / Done) + rename affordance.
# Sample photo export is fast on emu; long timeout for worker.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet"
    timeout: 20000
- assertVisible:
    id: "export_sheet_confirm"
- tapOn:
    id: "export_sheet_confirm"
- extendedWaitUntil:
    visible:
      id: "export_done"
    timeout: 180000
- assertVisible:
    id: "export_view"
- assertVisible:
    id: "export_share"
- assertVisible:
    id: "export_done"
- assertVisible:
    id: "export_rename"
