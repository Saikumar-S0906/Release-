appId: com.pixijoy.ai
---
# STUB - Export success View / Share / Done + human quality chips
# Uncomment when export_view / export_share / export_done / export_quality_* land
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_editor"
- extendedWaitUntil:
    visible: "Use sample"
    timeout: 25000
- tapOn: "Use sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet"
    timeout: 20000
- assertVisible:
    id: "export_sheet_confirm"
