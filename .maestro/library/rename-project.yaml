appId: com.pixijoy.ai
---
# G8 library rename. One sample so the library has a card (title is dated, e.g. Sample · Sep 25).
# Overflow is a separate window: tap text Rename (studio_library_rename), same as Delete.
# Dialog resource-ids: library_rename_field, library_rename_confirm.
# session_save_status is the session chip while the sample is open (same chrome as compare-hold).
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- assertVisible:
    id: "session_save_status"
- tapOn:
    id: "session_back"
- extendedWaitUntil:
    visible:
      id: "nav_my_stuff"
    timeout: 30000
- tapOn:
    id: "nav_my_stuff"
- extendedWaitUntil:
    visible:
      id: "library_project_card"
    timeout: 20000
- tapOn:
    id: "library_project_overflow"
- extendedWaitUntil:
    visible: "Rename"
    timeout: 10000
- tapOn: "Rename"
- extendedWaitUntil:
    visible:
      id: "library_rename_field"
    timeout: 10000
- tapOn:
    id: "library_rename_field"
- eraseText: 64
- inputText: "RenamedSample"
- hideKeyboard
- tapOn:
    id: "library_rename_confirm"
- extendedWaitUntil:
    visible: "RenamedSample"
    timeout: 15000
- assertNotVisible:
    id: "library_rename_field"
- assertVisible:
    id: "library_project_card"
