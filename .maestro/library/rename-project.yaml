appId: com.pixijoy.studio
---
# G8 library rename. One sample so the library has a card.
# Overflow is a separate window: tap text Rename. Dialog sets testTagsAsResourceId.
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- assertVisible:
    id: "session_save_status"
- tapOn:
    id: "session_back"
- extendedWaitUntil:
    visible:
      id: "nav_my_stuff"
    timeout: 30000
- tapOn:
    id: "nav_my_stuff"
- extendedWaitUntil:
    visible:
      id: "library_project_card"
    timeout: 20000
- tapOn:
    id: "library_project_overflow"
- extendedWaitUntil:
    visible: "Rename"
    timeout: 10000
- tapOn: "Rename"
- extendedWaitUntil:
    visible:
      id: "project_rename_sheet"
    timeout: 10000
- assertVisible:
    id: "library_rename_field"
- assertVisible:
    id: "library_rename_dismiss"
- tapOn:
    id: "library_rename_field"
- eraseText: 64
- inputText: "RenamedSample"
# hideKeyboard sends Back and dismisses this dialog. Confirm stays reachable.
- tapOn:
    id: "library_rename_confirm"
- extendedWaitUntil:
    visible: "RenamedSample"
    timeout: 15000
- assertNotVisible:
    id: "library_rename_field"
- assertVisible:
    id: "library_project_card"
