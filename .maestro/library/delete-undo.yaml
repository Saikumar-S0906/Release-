appId: com.pixijoy.ai
---
# R3.1 Library overflow + delete Snackbar Undo
# Nav tag is nav_my_stuff (StudioTab.Library). Sample open lands on Studio tab.
# Popup menu items: prefer text (resource-id may miss in separate window).
- runFlow: ../launch-to-home.yaml
- tapOn:
    id: "home_create"
- extendedWaitUntil:
    visible: "Try a sample"
    timeout: 20000
- tapOn: "Try a sample"
- extendedWaitUntil:
    visible:
      id: "photo_session"
    timeout: 60000
- tapOn:
    id: "session_back"
- extendedWaitUntil:
    visible:
      id: "nav_my_stuff"
    timeout: 30000
- tapOn:
    id: "nav_my_stuff"
- extendedWaitUntil:
    visible:
      id: "library_project_card"
    timeout: 20000
- tapOn:
    id: "library_project_overflow"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 10000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Project removed"
    timeout: 10000
- assertVisible:
    id: "library_delete_snackbar"
- tapOn: "Undo"
- extendedWaitUntil:
    visible:
      id: "library_project_card"
    timeout: 15000
- assertVisible:
    id: "nav_my_stuff"
