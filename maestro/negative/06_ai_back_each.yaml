appId: com.pixijoy.ai
tags:
  - negative
  - ai
  - nav
---
# AI tiles: open + Back returns to Create AI. No processing loop.
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_beautiful"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow5_beautiful"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- assertVisible:
    id: "create_hub_beautiful"
- tapOn:
    id: "create_hub_meme"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow6_funny"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_different"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_diff_host|flow_different"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- scrollUntilVisible:
    element:
      id: "home_talk"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home_talk"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow7_tell"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
