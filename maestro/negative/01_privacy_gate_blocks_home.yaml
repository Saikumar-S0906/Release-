appId: com.pixijoy.ai
tags:
  - negative
  - privacy
---
# NEG-01 Privacy gate blocks Home until Accept
- launchApp:
    appId: com.pixijoy.ai
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "privacy_accept"
    timeout: 45000
- assertVisible:
    id: "privacy_accept"
- assertNotVisible: "Enter Home"
- assertNotVisible:
    id: "nav_home"
- assertVisible:
    text: ".*Privacy.*"
- scrollUntilVisible:
    element: "Delete My Data"
    direction: DOWN
    timeout: 15000
- assertVisible: "Delete My Data"
- assertVisible:
    id: "privacy_accept"
