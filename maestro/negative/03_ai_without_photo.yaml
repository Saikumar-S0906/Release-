appId: com.pixijoy.ai
tags:
  - negative
  - create
  - ai
---
# NEG-03 AI Funny / Beautiful without a photo stay on-tool (no crash)
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_meme"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow6_funny"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_beautiful"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow5_beautiful"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
