appId: com.pixijoy.ai
tags:
  - negative
  - create
  - tools
---
# NEG-02 Tools Editor / Stickers without a photo stay on-tool (no crash)
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- tapOn:
    id: "create_hub_editor"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow15_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- tapOn:
    id: "create_hub_segment_tools"
- scrollUntilVisible:
    element:
      id: "create_hub_sticker"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_sticker"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow13_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
