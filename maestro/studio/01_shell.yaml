appId: com.pixijoy.studio
---
- launchApp:
    appId: com.pixijoy.studio
    clearState: true
- runFlow: helpers/onboard.yaml
- tapOn:
    id: "nav_create"
- extendedWaitUntil:
    visible:
      id: "create_hub_editor"
    timeout: 10000
- tapOn:
    id: "nav_my_stuff"
- assertVisible: "Library"
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "home_open_studio"
