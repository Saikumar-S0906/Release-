appId: com.pixijoy.studio
---
- launchApp:
    appId: com.pixijoy.studio
    clearState: true
- runFlow: helpers/onboard.yaml
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_restore"
- tapOn:
    id: "studio_use_sample"
- extendedWaitUntil:
    visible:
      id: "session_restore"
    timeout: 20000
- tapOn:
    id: "session_restore"
- tapOn:
    id: "session_back"
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_expand"
- tapOn:
    id: "studio_use_sample"
- extendedWaitUntil:
    visible:
      id: "session_apply_expand"
    timeout: 20000
- tapOn:
    id: "session_apply_expand"
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet_confirm"
    timeout: 10000
- tapOn:
    id: "export_sheet_confirm"
- extendedWaitUntil:
    visible:
      id: "session_status"
    timeout: 25000
