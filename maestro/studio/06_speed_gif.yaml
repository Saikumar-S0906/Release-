appId: com.pixijoy.studio
---
- launchApp:
    appId: com.pixijoy.studio
    clearState: true
- runFlow: helpers/onboard.yaml
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_segment_movie"
- tapOn:
    id: "create_hub_talking"
- tapOn:
    id: "studio_use_sample"
- extendedWaitUntil:
    visible:
      id: "movie_session"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "movie_speed"
    timeout: 10000
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet"
    timeout: 10000
- tapOn:
    id: "export_format_gif"
- tapOn:
    id: "export_sheet_confirm"
- extendedWaitUntil:
    visible:
      id: "session_status"
    timeout: 60000
