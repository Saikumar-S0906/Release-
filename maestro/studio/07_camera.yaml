appId: com.pixijoy.ai
---
- launchApp:
    appId: com.pixijoy.ai
    clearState: true
- runFlow: helpers/onboard.yaml
- tapOn:
    id: "home_take_photo"
- extendedWaitUntil:
    visible:
      id: "camera_screen"
    timeout: 15000
- tapOn:
    id: "camera_close"
- extendedWaitUntil:
    visible:
      id: "home_open_studio"
    timeout: 10000
