appId: com.pixijoy.ai
---
- extendedWaitUntil:
    visible:
      id: "studio_splash|privacy_accept|nav_home"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "privacy_accept"
    commands:
      - tapOn:
          id: "privacy_accept"
- extendedWaitUntil:
    visible:
      id: "nav_home"
    timeout: 15000
