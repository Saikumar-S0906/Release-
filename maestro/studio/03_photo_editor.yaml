appId: com.pixijoy.studio
---
- launchApp:
    appId: com.pixijoy.studio
    clearState: true
- runFlow: helpers/onboard.yaml
- tapOn:
    id: "nav_create"
- tapOn:
    id: "create_hub_editor"
- extendedWaitUntil:
    visible:
      id: "studio_use_sample"
    timeout: 10000
- tapOn:
    id: "studio_use_sample"
- extendedWaitUntil:
    visible:
      id: "session_export"
    timeout: 20000
- tapOn:
    id: "session_rotate"
- tapOn:
    id: "session_export"
- extendedWaitUntil:
    visible:
      id: "export_sheet_confirm"
    timeout: 10000
- tapOn:
    id: "export_sheet_confirm"
- extendedWaitUntil:
    visible:
      id: "session_status"
    timeout: 20000
- tapOn:
    id: "session_back"
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "home_recents"
