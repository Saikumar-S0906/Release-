appId: com.pixijoy.ai
tags:
  - positive
  - ai
  - funny
---
# Funny: sample → continue → generate → result → back (not processing loop)
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_meme"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow6_funny"
    timeout: 25000
- runFlow: ../helpers/use_sample.yaml
- runFlow: ../helpers/tap_continue.yaml
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "ai_generate|flow6_funny"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "ai_generate"
    commands:
      - tapOn:
          id: "ai_generate"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow6_funny"
    timeout: 90000
- assertVisible: "Your Meme is Ready!"
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
