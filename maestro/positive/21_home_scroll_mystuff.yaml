appId: com.pixijoy.ai
tags:
  - positive
  - chrome
---
- launchApp:
    appId: com.pixijoy.ai
    clearState: false
    permissions:
      all: allow
- runFlow: ../helpers/dismiss_ai_consent.yaml
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "nav_home"
    timeout: 30000
- tapOn:
    id: "nav_home"
- waitForAnimationToEnd
- takeScreenshot: chrome_home_after
- extendedWaitUntil:
    visible:
      id: "home_scroll_cue"
    timeout: 8000
- assertVisible: "Scroll for more"
- tapOn:
    id: "nav_my_stuff"
- waitForAnimationToEnd
- takeScreenshot: chrome_mystuff_before_rotate
- assertVisible:
    id: "nav_my_stuff"
