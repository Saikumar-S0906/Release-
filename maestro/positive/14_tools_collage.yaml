appId: com.pixijoy.ai
tags:
  - positive
  - tools
  - collage
---
# Collage: select photos (prefilled) → next → purpose → back to hub
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- scrollUntilVisible:
    element:
      id: "create_hub_collage"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "create_hub_collage"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow16_host"
    timeout: 25000
- runFlow: ../helpers/tap_continue.yaml
- extendedWaitUntil:
    visible:
      id: "flow16_host"
    timeout: 20000
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
