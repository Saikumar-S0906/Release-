      id: "flow_c06_host"
    timeout: 20000
- runFlow: ../helpers/use_sample.yaml
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- scrollUntilVisible:
