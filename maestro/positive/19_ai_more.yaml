    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_portrait"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_c09_host"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- scrollUntilVisible:
