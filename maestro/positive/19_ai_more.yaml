      id: "create_hub_greeting"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_greeting"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_c12_host"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- scrollUntilVisible:
    element:
      id: "create_hub_remix"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_remix"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_c14_host"
