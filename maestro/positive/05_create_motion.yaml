appId: com.pixijoy.ai
tags:
  - positive
  - create
  - motion
---
# POS-05 Create → Tools motion: Move + Talking photo
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- scrollUntilVisible:
    element:
      id: "home_intent_move"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "home_intent_move"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow14_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- tapOn:
    id: "create_hub_segment_tools"
- scrollUntilVisible:
    element:
      id: "create_hub_talking"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "create_hub_talking"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c11_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
