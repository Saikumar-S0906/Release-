appId: com.pixijoy.studio
tags:
  - positive
  - ai
  - tell
---
# Tell PixiJoy: suggestion → generate → result → back (not processing loop)
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- scrollUntilVisible:
    element:
      id: "home_talk"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home_talk"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow7_tell"
    timeout: 25000
- tapOn: "Make a birthday meme"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "ai_generate|flow7_tell"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "ai_generate"
    commands:
      - tapOn:
          id: "ai_generate"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow7_tell"
    timeout: 90000
- assertVisible: "Here's Your Result!"
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
