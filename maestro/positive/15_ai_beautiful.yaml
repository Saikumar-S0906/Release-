appId: com.pixijoy.studio
tags:
  - positive
  - ai
  - beautiful
---
# Beautiful: sample → continue → generate → result → back (not processing loop)
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_beautiful"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow5_beautiful"
    timeout: 25000
- runFlow: ../helpers/use_sample.yaml
- runFlow: ../helpers/tap_continue.yaml
- extendedWaitUntil:
    visible:
      id: "ai_generate|flow5_beautiful"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "ai_generate"
    commands:
      - tapOn:
          id: "ai_generate"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow5_beautiful"
    timeout: 90000
- assertVisible: "Result"
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
