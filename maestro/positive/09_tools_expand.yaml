appId: com.pixijoy.ai
tags:
  - positive
  - tools
  - expand
---
# Expand: more-tools → expand tile → sample → crop tab stays on-tool → back
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- tapOn:
    id: "create_hub_expand"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c10_host"
    timeout: 25000
- tapOn: "AI Expand"
- waitForAnimationToEnd
- runFlow: ../helpers/use_sample.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c10_host"
    timeout: 20000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
