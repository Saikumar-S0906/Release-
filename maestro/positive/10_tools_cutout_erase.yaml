appId: com.pixijoy.studio
tags:
  - positive
  - tools
  - cutout
  - erase
---
# Remove BG: continue → sample → result → erase → apply → back to hub
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- scrollUntilVisible:
    element:
      id: "create_hub_remove_bg"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_remove_bg"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c04_host"
    timeout: 25000
- runFlow: ../helpers/tap_continue.yaml
- runFlow: ../helpers/use_sample.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c04_erase|flow_c04_host"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "flow_c04_erase"
    commands:
      - tapOn:
          id: "flow_c04_erase"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "flow_c04_apply"
          timeout: 15000
      - tapOn:
          id: "flow_c04_apply"
      - waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
