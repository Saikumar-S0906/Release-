appId: com.pixijoy.ai
tags:
  - positive
  - create
  - ai
---
# POS-04 Create → AI: Beautiful, Funny, Different, Tell PixiJoy
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- assertVisible:
    text: "Cloud when available"
- assertVisible:
    id: "create_hub_meme"
- scrollUntilVisible:
    element:
      id: "home_talk"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "home_talk"

- tapOn:
    id: "create_hub_beautiful"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow5_beautiful"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- tapOn:
    id: "create_hub_meme"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow6_funny"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- tapOn:
    id: "create_hub_different"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_diff_host|flow_different"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml

- scrollUntilVisible:
    element:
      id: "home_talk"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home_talk"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow7_tell"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
