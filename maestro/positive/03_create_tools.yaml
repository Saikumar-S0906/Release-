appId: com.pixijoy.ai
tags:
  - positive
  - create
  - tools
---
# POS-03 Create → Tools: Add photo, Editor, Restore, Remove BG, Stickers
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- assertVisible: "Fix"
- scrollUntilVisible:
    element: "Cutout"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "create_hub_editor"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow15_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- tapOn:
    id: "create_hub_segment_tools"

- tapOn:
    id: "create_hub_restore"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c05_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- tapOn:
    id: "create_hub_segment_tools"

- scrollUntilVisible:
    element:
      id: "create_hub_remove_bg"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_remove_bg"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c04_host"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- tapOn:
    id: "create_hub_segment_tools"

- scrollUntilVisible:
    element:
      id: "create_hub_sticker"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create_hub_sticker"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow13_host|sticker_screen"
    timeout: 25000
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
