appId: com.pixijoy.ai
tags:
  - positive
  - tools
  - restore
---
# Restore: landing → sample photo → processing → result → back
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- tapOn:
    id: "create_hub_restore"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c05_host"
    timeout: 25000
- runFlow: ../helpers/tap_continue.yaml
- runFlow: ../helpers/use_sample.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c05_host"
    timeout: 40000
- runFlow: ../helpers/back_to_create_hub.yaml
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
