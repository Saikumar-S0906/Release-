appId: com.pixijoy.ai
tags:
  - positive
  - ai
  - different
---
# Different: sample → style continue → generate → result → back
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- runFlow: ../helpers/open_create_ai.yaml
- tapOn:
    id: "create_hub_different"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_diff_host|flow_different"
    timeout: 25000
- runFlow: ../helpers/use_sample.yaml
- extendedWaitUntil:
    visible:
      id: "tool_continue"
    timeout: 20000
- tapOn:
    id: "tool_continue"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "ai_generate"
    timeout: 20000
- tapOn:
    id: "ai_generate"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_diff_result"
    timeout: 90000
- assertVisible: "Style applied!"
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
