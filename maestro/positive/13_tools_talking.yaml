appId: com.pixijoy.studio
tags:
  - positive
  - tools
  - talking
---
# Talking photo: start → generate → result (not a processing loop) → back to hub
- runFlow: ../helpers/onboard_skip_to_home.yaml
- runFlow: ../helpers/open_create_hub.yaml
- scrollUntilVisible:
    element:
      id: "create_hub_talking"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "create_hub_talking"
- waitForAnimationToEnd
- runFlow: ../helpers/dismiss_anr.yaml
- extendedWaitUntil:
    visible:
      id: "flow_c11_host"
    timeout: 25000
- runFlow: ../helpers/tap_continue.yaml
- tapOn: "Generate"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "flow_c11_host"
    timeout: 60000
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
- runFlow: ../helpers/back_to_create_hub.yaml
- assertVisible:
    id: "nav_create"
